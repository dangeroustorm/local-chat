<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGPU Local AI Chat</title>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    .imessage-bubble-user {
      background-color: #007AFF;
      color: #FFFFFF;
      border-radius: 18px;
      border-bottom-right-radius: 4px;
    }

    .imessage-bubble-ai {
      background-color: #E9E9EB;
      color: #000000;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }

    @media (prefers-color-scheme: dark) {
      .imessage-bubble-ai {
        background-color: #262628;
        color: #FFFFFF;
      }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full bg-slate-100 dark:bg-zinc-950 text-slate-800 dark:text-slate-100 antialiased flex flex-col items-center justify-center p-0 sm:p-4">

  <div class="w-full max-w-md h-full sm:h-[720px] bg-white dark:bg-zinc-900 sm:rounded-3xl shadow-2xl border border-slate-200 dark:border-zinc-800 flex flex-col overflow-hidden relative">

    <!-- 顶栏 Header -->
    <header class="px-4 py-3 bg-slate-50/90 dark:bg-zinc-900/90 backdrop-blur border-b border-slate-200 dark:border-zinc-800 flex items-center justify-between shrink-0 z-10">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
          <i class="fa-solid fa-microchip"></i>
        </div>
        <div>
          <h1 id="header-model-name" class="text-sm font-semibold leading-none">WebGPU AI Chat</h1>
          <span id="status-badge" class="text-[11px] text-slate-500 dark:text-slate-400">未就绪</span>
        </div>
      </div>
      
      <span class="px-2 py-0.5 bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 text-[10px] font-mono font-medium rounded-full">
        端侧推理
      </span>
    </header>

    <!-- 主体区域 -->
    <div id="main-content" class="flex-1 flex flex-col overflow-hidden relative">

      <!-- 阶段 1：模型选择 -->
      <div id="view-intro" class="flex-1 p-5 flex flex-col justify-between overflow-y-auto space-y-4">
        
        <div class="space-y-4">
          <div class="text-center pt-2">
            <h2 class="text-base font-bold text-slate-900 dark:text-white">选择轻量 WebGPU 模型</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">单文件集成，已优化显存分配</p>
          </div>

          <div class="space-y-2">
            <!-- 选项 1：SmolLM2 360M (首选) -->
            <label class="block p-3 border-2 border-blue-500 bg-blue-50/50 dark:bg-blue-950/30 rounded-xl cursor-pointer transition-all model-option" onclick="selectModelOption(this, 'onnx-community/SmolLM2-360M-Instruct', 'SmolLM2 360M')">
              <div class="flex items-start justify-between">
                <div class="space-y-0.5">
                  <div class="flex items-center gap-1.5 font-bold text-xs text-slate-900 dark:text-white">
                    <input type="radio" name="model_choice" checked class="text-blue-600 focus:ring-0" />
                    <span>SmolLM2 360M</span>
                    <span class="px-1.5 py-0.2 bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 text-[9px] font-mono rounded">欧洲开源 · 推荐</span>
                  </div>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400">Hugging Face 研发，加载极快，输出零卡顿</p>
                </div>
                <span class="text-[10px] font-mono font-semibold text-slate-400">~220 MB</span>
              </div>
            </label>

            <!-- 选项 2：Qwen2.5 0.5B -->
            <label class="block p-3 border border-slate-200 dark:border-zinc-800 hover:border-slate-300 rounded-xl cursor-pointer transition-all model-option" onclick="selectModelOption(this, 'onnx-community/Qwen2.5-0.5B-Instruct', 'Qwen2.5 0.5B')">
              <div class="flex items-start justify-between">
                <div class="space-y-0.5">
                  <div class="flex items-center gap-1.5 font-bold text-xs text-slate-900 dark:text-white">
                    <input type="radio" name="model_choice" class="text-blue-600 focus:ring-0" />
                    <span>Qwen2.5 0.5B</span>
                  </div>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400">通用意图理解强，多语言表达优秀</p>
                </div>
                <span class="text-[10px] font-mono font-semibold text-slate-400">~350 MB</span>
              </div>
            </label>
          </div>

          <div class="space-y-2 text-[11px] leading-relaxed text-slate-600 dark:text-slate-400">
            <div class="p-2.5 bg-slate-50 dark:bg-zinc-800/50 rounded-lg border border-slate-100 dark:border-zinc-800">
              <i class="fa-solid fa-shield-halved text-emerald-500 mr-1"></i>
              <strong>端侧计算：</strong>数据不经过任何第三方 API，完全在浏览器显存内推导。
            </div>
          </div>
        </div>

        <button id="btn-start" onclick="checkAndStartLoading()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-xl transition-colors shadow-sm flex items-center justify-center space-x-2">
          <span>初始化并加载模型</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

      </div>

      <!-- 阶段 2：进度条 -->
      <div id="view-loading" class="hidden flex-1 p-6 flex flex-col items-center justify-center text-center space-y-6">
        <div class="relative w-16 h-16 flex items-center justify-center">
          <div class="absolute inset-0 rounded-full border-4 border-slate-200 dark:border-zinc-800"></div>
          <div id="loading-spinner" class="absolute inset-0 rounded-full border-4 border-blue-600 border-t-transparent animate-spin"></div>
          <i class="fa-solid fa-cube text-blue-600 text-lg"></i>
        </div>

        <div class="space-y-2 w-full max-w-xs">
          <h3 id="loading-title" class="text-sm font-semibold">正在初始化...</h3>
          <p id="loading-subtext" class="text-xs text-slate-500 dark:text-slate-400">正在申请 WebGPU 动态显存分配...</p>
          
          <div class="w-full bg-slate-200 dark:bg-zinc-800 h-2 rounded-full overflow-hidden mt-3">
            <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-200"></div>
          </div>
          <div id="progress-percent" class="text-[11px] font-mono text-slate-400 text-right">0%</div>
        </div>

        <div id="error-box" class="hidden w-full max-w-xs p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 rounded-xl text-left text-xs text-red-600 dark:text-red-400 space-y-1">
          <div class="font-bold flex items-center">
            <i class="fa-solid fa-circle-xmark mr-1.5"></i>
            <span>服务暂时不可用</span>
          </div>
          <p id="error-message" class="text-[11px] leading-relaxed"></p>
        </div>

        <button id="btn-cancel" onclick="cancelLoading()" class="px-4 py-2 border border-slate-300 dark:border-zinc-700 text-xs text-slate-600 dark:text-slate-400 rounded-lg">
          返回
        </button>
      </div>

      <!-- 阶段 3：对话界面 -->
      <div id="view-chat" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 no-scrollbar">
          <div class="text-center my-1">
            <span id="chat-badge-model" class="text-[10px] text-slate-400 bg-slate-200/50 dark:bg-zinc-800/50 px-2.5 py-1 rounded-full font-mono">
              WebGPU Ready
            </span>
          </div>

          <div class="flex flex-col items-start space-y-1 max-w-[82%]">
            <div class="imessage-bubble-ai px-3.5 py-2 text-xs sm:text-sm leading-snug shadow-sm">
              Hello! I am running locally in your browser. Ask me anything!
            </div>
            <span class="text-[9px] text-slate-400 px-1">Local AI</span>
          </div>
        </div>

        <form onsubmit="handleSend(event)" class="p-3 bg-slate-50/90 dark:bg-zinc-900/90 border-t border-slate-200 dark:border-zinc-800 flex items-center space-x-2 shrink-0">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="iMessage" 
            autocomplete="off"
            class="flex-1 px-4 py-2 bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 rounded-full text-xs sm:text-sm focus:outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"
          />
          <button 
            type="submit" 
            id="btn-send"
            class="w-8 h-8 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-colors disabled:opacity-40 shrink-0"
          >
            <i class="fa-solid fa-arrow-up text-xs"></i>
          </button>
        </form>

      </div>

    </div>
  </div>

  <script type="module">
    import { pipeline, env, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3';

    env.allowLocalModels = false;
    env.useBrowserCache = true;

    let selectedModelId = 'onnx-community/SmolLM2-360M-Instruct';
    let selectedModelName = 'SmolLM2 360M';

    let generator = null;
    let isLoading = false;
    let isLoaded = false;
    let chatHistory = [];
    const fileProgressMap = {};

    window.selectModelOption = selectModelOption;
    window.checkAndStartLoading = checkAndStartLoading;
    window.cancelLoading = cancelLoading;
    window.handleSend = handleSend;

    function selectModelOption(elem, modelId, modelName) {
      document.querySelectorAll('.model-option').forEach(el => {
        el.className = 'block p-3 border border-slate-200 dark:border-zinc-800 hover:border-slate-300 rounded-xl cursor-pointer transition-all model-option';
        const radio = el.querySelector('input[type="radio"]');
        if (radio) radio.checked = false;
      });

      elem.className = 'block p-3 border-2 border-blue-500 bg-blue-50/50 dark:bg-blue-950/30 rounded-xl cursor-pointer transition-all model-option';
      const currentRadio = elem.querySelector('input[type="radio"]');
      if (currentRadio) currentRadio.checked = true;

      selectedModelId = modelId;
      selectedModelName = modelName;
    }

    async function checkAndStartLoading() {
      switchView('view-loading');
      document.getElementById('loading-title').innerText = `正在加载 ${selectedModelName}`;
      document.getElementById('status-badge').innerText = '配置 WebGPU...';
      document.getElementById('error-box').classList.add('hidden');

      if (!('gpu' in navigator)) {
        showError('当前浏览器不支持 WebGPU，请使用 Chrome 或 Edge 浏览器。');
        return;
      }

      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          showError('未找到兼容的 WebGPU 显卡设备。');
          return;
        }

        // 核心修复 1：扩大 WebGPU 动态 Storage Buffer 上限，防止大权重内存报错
        const requiredLimits = {};
        if (adapter.limits.maxStorageBufferBindingSize) {
          requiredLimits.maxStorageBufferBindingSize = adapter.limits.maxStorageBufferBindingSize;
        }
        if (adapter.limits.maxBufferSize) {
          requiredLimits.maxBufferSize = adapter.limits.maxBufferSize;
        }

        const device = await adapter.requestDevice({ requiredLimits });
        if (!device) {
          showError('WebGPU 设备初始化失败。');
          return;
        }

        startModelLoading();
      } catch (err) {
        console.error('WebGPU Limit Config Error:', err);
        // 如果自定义 Limit 报错，后备不带 limit 再次尝试
        startModelLoading();
      }
    }

    async function startModelLoading() {
      isLoading = true;
      document.getElementById('loading-subtext').innerText = '正在请求模型权重文件...';
      document.getElementById('status-badge').innerText = '下载权重...';

      try {
        generator = await pipeline('text-generation', selectedModelId, {
          device: 'webgpu',
          dtype: 'q4',
          progress_callback: (p) => {
            if (!isLoading) return;

            if (p.status === 'progress') {
              fileProgressMap[p.file || 'model'] = p.progress || 0;
              const files = Object.keys(fileProgressMap);
              const totalProgress = Math.round(
                files.reduce((sum, key) => sum + fileProgressMap[key], 0) / (files.length || 1)
              );

              document.getElementById('progress-bar').style.width = `${totalProgress}%`;
              document.getElementById('progress-percent').innerText = `${totalProgress}%`;
              document.getElementById('loading-subtext').innerText = `下载权重中 (${totalProgress}%)`;
            } else if (p.status === 'ready') {
              document.getElementById('loading-subtext').innerText = '权重编译至显存...';
            }
          }
        });

        isLoading = false;
        isLoaded = true;

        document.getElementById('header-model-name').innerText = selectedModelName;
        document.getElementById('chat-badge-model').innerText = `${selectedModelName} (WebGPU Ready)`;
        document.getElementById('status-badge').innerText = '在线 (WebGPU)';
        document.getElementById('status-badge').className = 'text-[11px] text-emerald-500 font-medium';

        switchView('view-chat');

      } catch (error) {
        console.error('Model Load Error:', error);
        isLoading = false;
        showError('服务暂时不可用：无法加载此模型资源。建议尝试 SmolLM2 360M 模型。');
      }
    }

    function showError(msg) {
      document.getElementById('loading-spinner').classList.add('hidden');
      document.getElementById('error-message').innerText = msg;
      document.getElementById('error-box').classList.remove('hidden');
      document.getElementById('status-badge').innerText = '加载失败';
      document.getElementById('status-badge').className = 'text-[11px] text-red-500 font-medium';
    }

    function cancelLoading() {
      isLoading = false;
      generator = null;
      document.getElementById('status-badge').innerText = '未就绪';
      document.getElementById('status-badge').className = 'text-[11px] text-slate-500';
      switchView('view-intro');
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();

      if (!text || !generator || !isLoaded) return;

      input.value = '';
      const sendBtn = document.getElementById('btn-send');
      sendBtn.disabled = true;

      const chatContainer = document.getElementById('chat-messages');

      const userBubbleWrap = document.createElement('div');
      userBubbleWrap.className = 'flex flex-col items-end space-y-1 max-w-[82%] ml-auto';
      userBubbleWrap.innerHTML = `
        <div class="imessage-bubble-user px-3.5 py-2 text-xs sm:text-sm leading-snug shadow-sm break-words">
          ${escapeHtml(text)}
        </div>
      `;
      chatContainer.appendChild(userBubbleWrap);

      const aiBubbleWrap = document.createElement('div');
      aiBubbleWrap.className = 'flex flex-col items-start space-y-1 max-w-[82%]';
      
      const aiBubble = document.createElement('div');
      aiBubble.className = 'imessage-bubble-ai px-3.5 py-2 text-xs sm:text-sm leading-snug shadow-sm break-words';
      aiBubble.innerHTML = `<i class="fa-solid fa-ellipsis fa-pulse text-slate-400"></i>`;
      
      aiBubbleWrap.appendChild(aiBubble);
      aiBubbleWrap.innerHTML += `<span class="text-[9px] text-slate-400 px-1">${selectedModelName}</span>`;
      chatContainer.appendChild(aiBubbleWrap);

      chatContainer.scrollTop = chatContainer.scrollHeight;

      const messages = [
        { role: 'system', content: 'You are a helpful assistant.' },
        ...chatHistory,
        { role: 'user', content: text }
      ];

      let generatedResponse = '';

      // 核心修复 2：在打字机回调中增加 await 释放事件循环，防止 UI 渲染卡死
      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: async (tokenText) => {
          generatedResponse += tokenText;
          aiBubble.innerText = generatedResponse;
          chatContainer.scrollTop = chatContainer.scrollHeight;
          // 让出主线程微任务队列，强制渲染 DOM
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      });

      try {
        await generator(messages, {
          max_new_tokens: 128,
          temperature: 0.6,
          streamer: streamer
        });

        chatHistory.push({ role: 'user', content: text });
        chatHistory.push({ role: 'assistant', content: generatedResponse });

      } catch (err) {
        console.error('Inference Error:', err);
        aiBubble.innerHTML = `<span class="text-red-500 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> 推理异常</span>`;
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function switchView(viewId) {
      ['view-intro', 'view-loading', 'view-chat'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
