<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apertus WebGPU Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .imessage-user { background: #007AFF; color: #FFF; border-radius: 18px; border-bottom-right-radius: 4px; }
    .imessage-ai { background: #E9E9EB; color: #000; border-radius: 18px; border-bottom-left-radius: 4px; }
    @media (prefers-color-scheme: dark) { .imessage-ai { background: #262628; color: #FFF; } }
  </style>
</head>
<body class="h-full bg-slate-100 dark:bg-zinc-950 flex items-center justify-center p-0 sm:p-4">

  <div class="w-full max-w-md h-full sm:h-[720px] bg-white dark:bg-zinc-900 sm:rounded-3xl shadow-xl flex flex-col overflow-hidden border border-slate-200 dark:border-zinc-800">
    
    <header class="p-4 bg-slate-50 dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800 flex justify-between items-center">
      <span class="font-bold text-sm">Apertus 0.5B (WebGPU)</span>
      <span id="badge" class="text-xs text-slate-400">未就绪</span>
    </header>

    <!-- 视图 1：介绍 -->
    <div id="view-intro" class="flex-1 p-6 flex flex-col justify-between">
      <div class="space-y-4 text-xs leading-relaxed">
        <h2 class="text-base font-bold text-slate-900 dark:text-white">端侧 WebGPU 架构说明</h2>
        <p>基于 Worker 线程隔离架构运行 Apertus 0.5B 模型。张量推理与显存分配均在后台线程内完成，不阻塞 UI。</p>
        <div class="p-3 bg-amber-50 dark:bg-amber-950/30 text-amber-800 dark:text-amber-200 rounded-lg">
          首次运行需拉取约 300MB ONNX 权重文件，请确保网络连接通畅。
        </div>
      </div>
      <button onclick="initWorker()" class="w-full py-3 bg-blue-600 text-white text-sm font-bold rounded-xl">加载模型</button>
    </div>

    <!-- 视图 2：进度条 -->
    <div id="view-loading" class="hidden flex-1 p-6 flex flex-col items-center justify-center space-y-4 text-center">
      <div id="progress-text" class="text-xs font-mono text-slate-500">正在初始化 Web Worker...</div>
      <div class="w-full bg-slate-200 dark:bg-zinc-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-200"></div>
      </div>
      <div id="error-box" class="hidden p-3 bg-red-50 text-red-600 text-xs rounded-lg font-bold"></div>
    </div>

    <!-- 视图 3：对话 -->
    <div id="view-chat" class="hidden flex-1 flex flex-col overflow-hidden">
      <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
      <form onsubmit="sendMessage(event)" class="p-3 border-t border-slate-200 dark:border-zinc-800 flex gap-2">
        <input type="text" id="chat-input" placeholder="iMessage" class="flex-1 px-4 py-2 bg-slate-100 dark:bg-zinc-800 rounded-full text-xs sm:text-sm focus:outline-none" />
        <button id="btn-send" type="submit" class="w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center">
          <i class="fa-solid fa-arrow-up text-xs"></i>
        </button>
      </form>
    </div>

  </div>

  <script>
    let aiWorker = null;
    let chatHistory = [];
    let currentAiBubble = null;

    function initWorker() {
      switchView('view-loading');
      document.getElementById('badge').innerText = '正在加载...';

      // 创建后台 Web Worker 线程
      aiWorker = new Worker('worker.js', { type: 'module' });

      aiWorker.onmessage = (e) => {
        const { status, progress, token, error } = e.data;

        if (status === 'progress') {
          if (progress.status === 'progress') {
            const pct = Math.round(progress.progress || 0);
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('progress-text').innerText = `加载权重文件中... ${pct}%`;
          }
        } else if (status === 'ready') {
          document.getElementById('badge').innerText = '在线 (WebGPU)';
          switchView('view-chat');
        } else if (status === 'update') {
          if (currentAiBubble) {
            currentAiBubble.innerText += token;
            scrollChat();
          }
        } else if (status === 'complete') {
          document.getElementById('btn-send').disabled = false;
        } else if (status === 'error') {
          document.getElementById('error-box').innerText = '服务暂时不可用: ' + error;
          document.getElementById('error-box').classList.remove('hidden');
        }
      };

      aiWorker.postMessage({ type: 'load' });
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !aiWorker) return;

      input.value = '';
      document.getElementById('btn-send').disabled = true;

      const chatBox = document.getElementById('chat-box');

      // 用户气泡
      chatBox.innerHTML += `<div class="flex justify-end"><div class="imessage-user px-3.5 py-2 text-xs sm:text-sm max-w-[80%]">${escapeHtml(text)}</div></div>`;

      // AI 占位气泡
      const aiWrap = document.createElement('div');
      aiWrap.className = 'flex justify-start';
      currentAiBubble = document.createElement('div');
      currentAiBubble.className = 'imessage-ai px-3.5 py-2 text-xs sm:text-sm max-w-[80%]';
      aiWrap.appendChild(currentAiBubble);
      chatBox.appendChild(aiWrap);

      scrollChat();

      aiWorker.postMessage({
        type: 'generate',
        data: { text, history: chatHistory }
      });
    }

    function switchView(id) {
      ['view-intro', 'view-loading', 'view-chat'].forEach(v => document.getElementById(v).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function scrollChat() {
      const box = document.getElementById('chat-box');
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
